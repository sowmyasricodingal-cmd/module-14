<!DOCTYPE html>
<html>
<head>
    <title>Print Random Numbers</title>
</head>
<body>

<h2>Random Numbers Generator</h2>
<p id="output"></p>

<script>
    let count = 1;          // loop counter
    let result = "";        // to store numbers

    while (count <= 10) {
        let randomNumber = Math.floor(Math.random() * 100); 
        result += randomNumber + " ";
        count++;
    }

    document.getElementById("output").innerHTML = result;
</script>

</body>
</html>
